<!doctype html>
<!--
  Исходник картинки для соцсетей (og.png, 1200×630). Перерисовать:
  "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless --hide-scrollbars
    --window-size=1200,630 --screenshot=site\og.png site\og-card.html
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative; box-sizing: border-box; padding: 84px 90px;
  font-family: system-ui, 'Segoe UI', Roboto, sans-serif; color: #ecebf5;
  background:
    radial-gradient(55% 70% at 0% 0%, rgb(99 102 241 / 0.45), transparent 70%),
    radial-gradient(45% 60% at 100% 10%, rgb(217 70 239 / 0.35), transparent 70%),
    radial-gradient(60% 60% at 60% 110%, rgb(139 92 246 / 0.3), transparent 70%),
    #0f0d19;
}
.logo { display: flex; align-items: center; gap: 20px; font-size: 34px; font-weight: 800; letter-spacing: -0.01em; }
.logo img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.4); }
h1 { margin: 62px 0 0; font-size: 74px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 850; max-width: 900px; }
h1 span { background: linear-gradient(135deg, #818cf8 0%, #a78bfa 45%, #e879f9 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
p { margin: 30px 0 0; font-size: 30px; color: #b9b5d0; }
.url { position: absolute; right: 90px; bottom: 70px; font-size: 26px; font-weight: 600; color: #c4b5fd; }
</style>
</head>
<body>
  <div class="logo"><img src="../client/public/icon-192.png" alt="">Temp Messenger</div>
  <h1>Мессенджер, который <span>ничего о вас не знает</span></h1>
  <p>Без номера и почты · сквозное шифрование · звонки и файлы</p>
  <div class="url">tempmessenger.tech</div>
</body>
</html>
