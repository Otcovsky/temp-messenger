# /etc/nginx/sites-available/chat.smartenergypro.tech
# HTTPS (listen 443, сертификат) добавит certbot --nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.smartenergypro.tech;

    root /home/otche/temp-messenger/client;
    index index.html;

    server_tokens off;
    # Логи без IP и адресов: серверу не нужно знать, кто когда заходил
    access_log off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://chat.smartenergypro.tech; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /ws {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header X-Forwarded-For $remote_addr;  # адрес клиента для квот (quota.py)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header X-Forwarded-For $remote_addr;  # адрес клиента для квот (quota.py)
    }

    # Зашифрованные файлы. Предел чуть больше TM_MAX_BLOB_BYTES (26 МиБ);
    # тело передаётся ретранслятору потоком, без промежуточной записи на диск nginx.
    location /blob/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header X-Forwarded-For $remote_addr;  # адрес клиента для квот (quota.py)
        client_max_body_size 27m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Внимание: add_header внутри location отменил бы заголовки безопасности выше,
    # поэтому кеширование задаётся через expires.

    # Файлы с хешем в имени — кешируются навсегда
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
