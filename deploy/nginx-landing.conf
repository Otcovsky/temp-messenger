# /etc/nginx/sites-available/tempmessenger.tech — сайт-визитка на корневом домене.
# Статика из ~/temp-messenger-site (выкладка: deploy/deploy-site.sh). HTTPS добавит certbot --nginx.
# Зоны tm_conn и tm_page — из /etc/nginx/conf.d/tm-limits.conf (см. deploy/README.md).

# www → без www
server {
    listen 80;
    listen [::]:80;
    server_name www.tempmessenger.tech;
    return 301 https://tempmessenger.tech$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name tempmessenger.tech;

    root /home/ubuntu/temp-messenger-site;
    index index.html;

    server_tokens off;
    access_log off;   # как и в чате: без журнала посещений с IP

    limit_conn tm_conn 20;
    limit_req zone=tm_page burst=100 nodelay;

    # Скрипты — только Google Analytics (/ga.js + gtag), и то если сайт собран с TM_GA_ID.
    # Встроенных скриптов нет; JSON-LD — данные, а не код, CSP его не трогает.
    # Без аналитики хватит: default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; ...
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://www.googletagmanager.com; connect-src https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' https://*.google-analytics.com https://*.googletagmanager.com; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    error_page 404 /404.html;

    # Внимание: add_header внутри location отменил бы заголовки выше,
    # поэтому кеш задаётся через expires.

    location = / {
        expires 1h;
        try_files /index.html =404;
    }

    # Английская версия страницы — адрес /en без слэша; старый /en/ навсегда ведёт туда
    location = /en {
        expires 1h;
        default_type text/html;
        try_files /en/index.html =404;
    }

    location = /en/ {
        return 301 /en;
    }

    # Украинская версия — так же, адрес /uk без слэша
    location = /uk {
        expires 1h;
        default_type text/html;
        try_files /uk/index.html =404;
    }

    location = /uk/ {
        return 301 /uk;
    }

    location = /download/temp-messenger.apk {
        types { }
        default_type application/vnd.android.package-archive;
        expires -1;   # имя одно на все версии — всегда сверяться с сервером
        try_files $uri =404;
    }

    # Сюда Android-приложение ходит узнать, не вышла ли новая версия (client/src/appUpdate.ts)
    location = /download/version.json {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(png|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        expires 1h;
        try_files $uri =404;
    }
}
